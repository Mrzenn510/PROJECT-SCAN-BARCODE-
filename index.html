<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Scan QR Alat — Laporan</title>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    margin: 0;
    padding: 16px;
  }
  .card {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    max-width: 480px;
    margin: 0 auto 16px auto;
  }
  h1 { font-size: 1.2rem; margin-top: 0; }
  h2 { font-size: 1rem; margin: 0 0 8px; color: #cbd5e1; }
  label { display: block; font-size: 0.85rem; margin: 10px 0 4px; color: #94a3b8; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: #052e12;
    font-weight: 700;
    font-size: 1rem;
    margin-top: 14px;
    cursor: pointer;
  }
  button.secondary { background: #38bdf8; }
  button:disabled { opacity: 0.5; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; }
  .status { margin-top: 10px; font-size: 0.9rem; padding: 10px; border-radius: 8px; display: none; }
  .status.ok { background: #14532d; display: block; }
  .status.err { background: #7f1d1d; display: block; }
  .status.info { background: #1e3a8a; display: block; }
  .hidden { display: none; }
  .hint { font-size: 0.8rem; color: #64748b; margin-top: 6px; }
  a.nav { color: #38bdf8; }

  /* Kartu hasil data alat */
  .result-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 4px; color: #f1f5f9; }
  .result-kode { display:inline-block; background:#164e63; color:#67e8f9; font-weight:700; font-size:0.85rem; padding:3px 10px; border-radius:999px; margin-bottom:12px; }
  dl.result-list { margin: 0; }
  dl.result-list .row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #334155; }
  dl.result-list .row:last-child { border-bottom:none; }
  dl.result-list dt { color:#94a3b8; font-size:0.82rem; }
  dl.result-list dd { margin:0; text-align:right; font-weight:600; font-size:0.9rem; max-width:60%; }
</style>
</head>
<body>

<div class="card">
  <h1>📷 Scan QR Alat — Laporan</h1>
  <div class="hint">Arahkan kamera ke QR yang tertempel di alat (APAR/FSS). Data akan otomatis muncul sesuai kode alat, langsung dari data FSS &amp; APAR — tidak perlu upload/download manual.</div>
</div>

<div class="card">
  <h2>Scan QR</h2>
  <button id="btnStart">Mulai Scan QR</button>
  <div class="hint" style="margin-top:10px;"><a class="nav" href="generate.html">🏷️ Cetak / buat QR kode alat di sini</a></div>
  <div id="reader" class="hidden"></div>
</div>

<div id="statusMsg" class="status"></div>

<div class="card hidden" id="resultCard">
  <span class="result-kode" id="resultKode">Kode</span>
  <div class="result-title" id="resultTitle">Ruangan</div>
  <dl class="result-list" id="resultList"></dl>
  <button id="btnScanLagi" class="secondary">Scan Lagi</button>
</div>

;

  // Index cepat: kode -> baris data
  const DATA_BY_KODE = {};
  APAR_DATA.forEach(r => { DATA_BY_KODE[String(r.kode).trim()] = r; });

  // ===== Status message =====
  const statusMsg = document.getElementById('statusMsg');
  function showStatus(msg, type) {
    statusMsg.textContent = msg;
    statusMsg.className = 'status ' + type;
    setTimeout(() => { statusMsg.className = 'status'; }, 4000);
  }

  // ===== Tampilkan hasil lookup =====
  const resultCard = document.getElementById('resultCard');
  const resultKode = document.getElementById('resultKode');
  const resultTitle = document.getElementById('resultTitle');
  const resultList = document.getElementById('resultList');

  const FIELD_LABELS = [
    ['gedung', 'Gedung'],
    ['lantai', 'Lantai'],
    ['merk', 'Merk'],
    ['kapasitas', 'Kapasitas'],
    ['jenisGas', 'Jenis Gas'],
    ['no', 'No. Data'],
  ];

  function tampilkanData(kode) {
    const data = DATA_BY_KODE[kode];
    if (!data) {
      resultCard.classList.add('hidden');
      showStatus(`Kode "${kode}" tidak ditemukan di data FSS/APAR.`, 'err');
      return;
    }
    resultKode.textContent = 'Kode: ' + data.kode;
    resultTitle.textContent = data.ruangan || '-';
    resultList.innerHTML = FIELD_LABELS.map(([key, label]) => {
      const val = data[key];
      return `<div class="row"><dt>${label}</dt><dd>${(val === null || val === undefined || val === '') ? '-' : val}</dd></div>`;
    }).join('');
    resultCard.classList.remove('hidden');
    showStatus('Data alat ditemukan ✅', 'ok');
  }

  // ===== QR Scanner =====
  let html5QrCode;
  const readerDiv = document.getElementById('reader');
  const btnStart = document.getElementById('btnStart');

  async function startScanner() {
    readerDiv.classList.remove('hidden');
    resultCard.classList.add('hidden');
    btnStart.disabled = true;

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        () => {}
      );
    } catch (err) {
      showStatus('Gagal membuka kamera: ' + err, 'err');
      btnStart.disabled = false;
    }
  }

  async function stopScanner() {
    if (html5QrCode) {
      try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
    }
    readerDiv.classList.add('hidden');
    btnStart.disabled = false;
  }

  async function onScanSuccess(decodedText) {
    await stopScanner();
    const kode = decodedText.trim();
    tampilkanData(kode);
  }

  btnStart.addEventListener('click', startScanner);

  document.getElementById('btnScanLagi').addEventListener('click', () => {
    resultCard.classList.add('hidden');
    startScanner();
  });
</script>
